name: Validate quick actions

on:
  pull_request:
    paths:
      - "app/src/main/**"
      - "app/src/test/**"
      - "app/build.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle.kts"
      - ".github/workflows/quick-actions.yml"
  push:
    branches:
      - main
    paths:
      - "app/src/main/**"
      - "app/src/test/**"
      - "app/build.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle.kts"
      - ".github/workflows/quick-actions.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Run JVM tests
        run: ./gradlew testDebugUnitTest --stacktrace
