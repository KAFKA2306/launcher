name: Validate quick actions

on:
  pull_request:
    paths:
      - "app/src/main/**"
      - "app/src/test/**"
      - "app/build.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle.kts"
      - ".gitignore"
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - "app/src/main/**"
      - "app/src/test/**"
      - "app/build.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle.kts"
      - ".gitignore"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Reject tracked APK artifacts
        shell: bash
        run: |
          set -euo pipefail
          tracked="$(git ls-files '*.apk')"
          if [[ -n "$tracked" ]]; then
            echo 'Generated APK files must not be tracked:' >&2
            printf '%s\n' "$tracked" >&2
            exit 1
          fi
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Run Gemini feedback payload tests
        run: ./gradlew testDebugUnitTest --tests com.kafka.launcher.domain.usecase.GeminiPayloadBuilderTest --stacktrace
      - name: Run QuickAction regression tests
        run: ./gradlew testDebugUnitTest --tests com.kafka.launcher.quickactions.AndroidSystemModuleTest --stacktrace
      - name: Audit Gemini feedback log privacy contract
        run: |
          grep -q 'gemini_sync_events.jsonl' app/src/main/java/com/kafka/launcher/config/LauncherConfig.kt
          grep -q 'recommendationFeedback' app/src/main/java/com/kafka/launcher/domain/usecase/GeminiPayloadBuilder.kt
          ! grep -E 'apiKey|rawPayload|rawResponse' app/src/main/java/com/kafka/launcher/data/log/GeminiSyncLogWriter.kt
      - name: Confirm checkout clean
        run: git status --porcelain | tee /tmp/status && test ! -s /tmp/status
